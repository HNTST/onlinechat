basePath: /api/v2
definitions:
  chat_transport_http.AddUserToChatRequest:
    properties:
      users_ids:
        items:
          type: integer
        type: array
    required:
    - users_ids
    type: object
  chat_transport_http.AddUserToChatResponse:
    properties:
      chat_id:
        format: int64
        type: integer
      users_ids:
        items:
          format: int64
          type: integer
        type: array
    type: object
  chat_transport_http.ChatDTO:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  chat_transport_http.GetChatMembersResponse:
    properties:
      members:
        items:
          type: integer
        type: array
    type: object
  chat_transport_http.GetChatMessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/chat_transport_http.MessageDTO'
        type: array
    type: object
  chat_transport_http.GetUserChatsResponse:
    properties:
      chats:
        items:
          $ref: '#/definitions/chat_transport_http.ChatDTO'
        type: array
    type: object
  chat_transport_http.MessageDTO:
    properties:
      message:
        type: string
      sender_id:
        type: integer
      sent_at:
        type: string
    type: object
  chat_transport_http.SaveChatRequest:
    properties:
      author:
        type: integer
      chat_name:
        type: string
      target_user:
        type: integer
    required:
    - author
    - chat_name
    - target_user
    type: object
  chat_transport_http.SaveChatResponse:
    properties:
      chat_id:
        type: integer
    type: object
  chat_transport_http.SaveMessageRequest:
    properties:
      chat_id:
        type: integer
      message:
        type: string
      sender_id:
        type: integer
    required:
    - chat_id
    - message
    - sender_id
    type: object
  domain.Chat:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Messages:
    properties:
      chat_id:
        type: integer
      id:
        type: integer
      message:
        type: string
      sender_id:
        type: integer
      sent_at:
        type: string
    type: object
  domain.User:
    properties:
      id:
        type: integer
      password:
        type: string
      reg:
        type: string
      username:
        type: string
    type: object
  files_transport_http.UploadAvatarResponse:
    properties:
      file_id:
        type: integer
    type: object
  users_transport_http.GetUserIDResponse:
    properties:
      user_id:
        type: integer
    type: object
  users_transport_http.GetUserResponse:
    properties:
      id:
        type: integer
      reg:
        type: string
      username:
        type: string
    type: object
  users_transport_http.SaveUserRequest:
    properties:
      password:
        description: Временно не обязательный
        minLength: 8
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - username
    type: object
  users_transport_http.SaveUserResponse:
    properties:
      id:
        type: integer
      reg:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Messenger / chat application API (v1 legacy + v2 feature-based)
  title: Discord API
  version: "1.0"
paths:
  /api/v1/chat:
    post:
      consumes:
      - application/json
      description: Create a new chat with two participants
      parameters:
      - description: Chat data
        in: body
        name: request
        required: true
        schema:
          properties:
            author:
              format: int64
              type: integer
            chat_name:
              type: string
            target_user:
              format: int64
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              chat_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Create chat
      tags:
      - v1 / Chat
  /api/v1/chats:
    get:
      consumes:
      - application/json
      description: Get all chats that a user is a member of
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Chat'
            type: array
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get user chats
      tags:
      - v1 / Chat
  /api/v1/chats/add_user:
    post:
      consumes:
      - application/json
      description: Add a user to an existing chat by chat ID
      parameters:
      - description: Add user data
        in: body
        name: request
        required: true
        schema:
          properties:
            chat_id:
              format: int64
              type: integer
            target_user_id:
              format: int64
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Add user to chat
      tags:
      - v1 / Chat
  /api/v1/chats/members:
    get:
      consumes:
      - application/json
      description: Get all member user IDs for a chat
      parameters:
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              members:
                items:
                  format: int64
                  type: integer
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get chat members
      tags:
      - v1 / Chat
  /api/v1/messages:
    get:
      consumes:
      - application/json
      description: Get all messages in a chat
      parameters:
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Messages'
            type: array
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get chat messages
      tags:
      - v1 / Chat
  /api/v1/user:
    get:
      consumes:
      - application/json
      description: Get user details by user ID
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get user
      tags:
      - v1 / User
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              user_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Register user
      tags:
      - v1 / User
  /api/v1/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload a user avatar file to MinIO and save metadata
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: Avatar image file
        in: formData
        name: new_user_avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              file_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Upload avatar
      tags:
      - v1 / Files
  /api/v1/user_id:
    get:
      consumes:
      - application/json
      description: Get user ID by username
      parameters:
      - description: Username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              user_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get user ID
      tags:
      - v1 / User
  /api/v1/ws:
    get:
      description: Upgrade HTTP to WebSocket for real-time messaging
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: object
      summary: WebSocket connection
      tags:
      - v1 / WebSocket
  /api/v2/chat:
    post:
      consumes:
      - application/json
      description: Create a new chat with two participants
      parameters:
      - description: Chat data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat_transport_http.SaveChatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chat_transport_http.SaveChatResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Create chat
      tags:
      - v2 / Chat
  /api/v2/chat/{chat_id}/members:
    post:
      consumes:
      - application/json
      description: Add users to an existing chat by chat ID
      parameters:
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: integer
      - description: Users IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat_transport_http.AddUserToChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat_transport_http.AddUserToChatResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Add users to chat
      tags:
      - v2 / Chat
  /api/v2/chat/message:
    post:
      consumes:
      - application/json
      description: Send a message to a chat
      parameters:
      - description: Message data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat_transport_http.SaveMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Send message
      tags:
      - v2 / Chat
  /api/v2/chats:
    get:
      consumes:
      - application/json
      description: Get all chats that a user is a member of
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat_transport_http.GetUserChatsResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get user chats
      tags:
      - v2 / Chat
  /api/v2/chats/members:
    get:
      consumes:
      - application/json
      description: Get all member user IDs for a chat
      parameters:
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat_transport_http.GetChatMembersResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get chat members
      tags:
      - v2 / Chat
  /api/v2/messages:
    get:
      consumes:
      - application/json
      description: Get all messages in a chat
      parameters:
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat_transport_http.GetChatMessagesResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get chat messages
      tags:
      - v2 / Chat
  /api/v2/user:
    get:
      consumes:
      - application/json
      description: Get user details by user ID
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users_transport_http.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get user
      tags:
      - v2 / User
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.SaveUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/users_transport_http.SaveUserResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Register user
      tags:
      - v2 / User
  /api/v2/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload a user avatar file to MinIO and save metadata
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: Avatar image file
        in: formData
        name: new_user_avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/files_transport_http.UploadAvatarResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Upload avatar
      tags:
      - v2 / Files
  /api/v2/user_id:
    get:
      consumes:
      - application/json
      description: Get user ID by username
      parameters:
      - description: Username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users_transport_http.GetUserIDResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Get user ID
      tags:
      - v2 / User
  /api/v2/ws:
    get:
      description: Upgrade HTTP to WebSocket for real-time messaging (v2)
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: object
      summary: WebSocket connection
      tags:
      - v2 / WebSocket
swagger: "2.0"
