basePath: /
definitions:
  discord_internal_core_domain.Chat:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  discord_internal_core_domain.Messages:
    properties:
      chat_id:
        type: integer
      id:
        type: integer
      message:
        type: string
      sender_id:
        type: integer
      sent_at:
        type: string
    type: object
  discord_internal_core_domain.User:
    properties:
      id:
        type: integer
      password:
        type: string
      reg:
        type: string
      username:
        type: string
    type: object
  internal_features_chat_transport_http.AddUserToChatRequest:
    properties:
      users_ids:
        items:
          type: integer
        type: array
    required:
    - users_ids
    type: object
  internal_features_chat_transport_http.AddUserToChatResponse:
    properties:
      chat_id:
        format: int64
        type: integer
      users_ids:
        items:
          format: int64
          type: integer
        type: array
    type: object
  internal_features_chat_transport_http.ChatDTO:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  internal_features_chat_transport_http.GetChatMembersResponse:
    properties:
      members:
        items:
          type: integer
        type: array
    type: object
  internal_features_chat_transport_http.GetChatMessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/internal_features_chat_transport_http.MessageDTO'
        type: array
    type: object
  internal_features_chat_transport_http.GetUserChatsResponse:
    properties:
      chats:
        items:
          $ref: '#/definitions/internal_features_chat_transport_http.ChatDTO'
        type: array
    type: object
  internal_features_chat_transport_http.MessageDTO:
    properties:
      message:
        type: string
      sender_id:
        type: integer
      sent_at:
        type: string
    type: object
  internal_features_chat_transport_http.SaveChatRequest:
    properties:
      author:
        type: integer
      chat_name:
        type: string
      target_user:
        type: integer
    required:
    - author
    - chat_name
    - target_user
    type: object
  internal_features_chat_transport_http.SaveChatResponse:
    properties:
      chat_id:
        type: integer
    type: object
  internal_features_chat_transport_http.SaveMessageRequest:
    properties:
      chat_id:
        type: integer
      message:
        type: string
      sender_id:
        type: integer
    required:
    - chat_id
    - message
    - sender_id
    type: object
  internal_features_files_transport_http.UploadAvatarResponse:
    properties:
      file_id:
        type: integer
    type: object
  internal_features_user_transport_http.GetUserIDResponse:
    properties:
      user_id:
        type: integer
    type: object
  internal_features_user_transport_http.GetUserResponse:
    properties:
      id:
        type: integer
      reg:
        type: string
      username:
        type: string
    type: object
  internal_features_user_transport_http.SaveUserRequest:
    properties:
      password:
        description: Временно не обязательный
        minLength: 8
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - username
    type: object
  internal_features_user_transport_http.SaveUserResponse:
    properties:
      id:
        type: integer
      reg:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: API мессенджер / чат-приложение (v1 legacy + v2 feature-based)
  title: Discord API
  version: "1.0"
paths:
  /api/v1/chat:
    post:
      consumes:
      - application/json
      description: Создание нового чата с двумя участниками
      parameters:
      - description: Данные чата
        in: body
        name: request
        required: true
        schema:
          properties:
            author:
              format: int64
              type: integer
            chat_name:
              type: string
            target_user:
              format: int64
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              chat_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Создание чата
      tags:
      - v1 / Чаты
  /api/v1/chats:
    get:
      consumes:
      - application/json
      description: Получение всех чатов, в которых состоит пользователь
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/discord_internal_core_domain.Chat'
            type: array
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Чаты пользователя
      tags:
      - v1 / Чаты
  /api/v1/chats/add_user:
    post:
      consumes:
      - application/json
      description: Добавление пользователя в существующий чат по ID чата
      parameters:
      - description: Данные для добавления
        in: body
        name: request
        required: true
        schema:
          properties:
            chat_id:
              format: int64
              type: integer
            target_user_id:
              format: int64
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Добавление пользователя в чат
      tags:
      - v1 / Чаты
  /api/v1/chats/members:
    get:
      consumes:
      - application/json
      description: Получение ID всех участников чата
      parameters:
      - description: ID чата
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              members:
                items:
                  format: int64
                  type: integer
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Участники чата
      tags:
      - v1 / Чаты
  /api/v1/messages:
    get:
      consumes:
      - application/json
      description: Получение всех сообщений в чате
      parameters:
      - description: ID чата
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/discord_internal_core_domain.Messages'
            type: array
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Сообщения чата
      tags:
      - v1 / Чаты
  /api/v1/user:
    get:
      consumes:
      - application/json
      description: Получение данных пользователя по его ID
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/discord_internal_core_domain.User'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Получение пользователя
      tags:
      - v1 / Пользователи
    post:
      consumes:
      - application/json
      description: Создание новой учётной записи пользователя
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              user_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Регистрация пользователя
      tags:
      - v1 / Пользователи
  /api/v1/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Загрузка файла аватара пользователя в MinIO и сохранение метаданных
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      - description: Файл изображения аватара
        in: formData
        name: new_user_avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              file_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Загрузка аватара
      tags:
      - v1 / Файлы
  /api/v1/user_id:
    get:
      consumes:
      - application/json
      description: Получение ID пользователя по его имени
      parameters:
      - description: Имя пользователя
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              user_id:
                format: int64
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Получение ID пользователя
      tags:
      - v1 / Пользователи
  /api/v1/ws:
    get:
      description: Обновление HTTP до WebSocket для обмена сообщениями в реальном
        времени
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: object
      summary: WebSocket-соединение
      tags:
      - v1 / WebSocket
  /api/v2/chat:
    post:
      consumes:
      - application/json
      description: Создание нового чата с двумя участниками
      parameters:
      - description: Данные чата
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_chat_transport_http.SaveChatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_chat_transport_http.SaveChatResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Создание чата
      tags:
      - v2 / Чаты
  /api/v2/chat/{chat_id}/members:
    post:
      consumes:
      - application/json
      description: Добавление пользователей в существующий чат по его ID
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: integer
      - description: ID пользователей
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_chat_transport_http.AddUserToChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_chat_transport_http.AddUserToChatResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Добавление пользователей в чат
      tags:
      - v2 / Чаты
  /api/v2/chat/message:
    post:
      consumes:
      - application/json
      description: Отправка сообщения в чат
      parameters:
      - description: Данные сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_chat_transport_http.SaveMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Отправка сообщения
      tags:
      - v2 / Чаты
  /api/v2/chats:
    get:
      consumes:
      - application/json
      description: Получение всех чатов, в которых состоит пользователь
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_chat_transport_http.GetUserChatsResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Чаты пользователя
      tags:
      - v2 / Чаты
  /api/v2/chats/members:
    get:
      consumes:
      - application/json
      description: Получение ID всех участников чата
      parameters:
      - description: ID чата
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_chat_transport_http.GetChatMembersResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Участники чата
      tags:
      - v2 / Чаты
  /api/v2/messages:
    get:
      consumes:
      - application/json
      description: Получение всех сообщений в чате
      parameters:
      - description: ID чата
        in: query
        name: chat_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_chat_transport_http.GetChatMessagesResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Сообщения чата
      tags:
      - v2 / Чаты
  /api/v2/user:
    get:
      consumes:
      - application/json
      description: Получение данных пользователя по его ID
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_user_transport_http.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Получение пользователя
      tags:
      - v2 / Пользователи
    post:
      consumes:
      - application/json
      description: Создание новой учётной записи пользователя
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_user_transport_http.SaveUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_user_transport_http.SaveUserResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Регистрация пользователя
      tags:
      - v2 / Пользователи
  /api/v2/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Загрузка файла аватара пользователя в MinIO и сохранение метаданных
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      - description: Файл изображения аватара
        in: formData
        name: new_user_avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_files_transport_http.UploadAvatarResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Загрузка аватара
      tags:
      - v2 / Файлы
  /api/v2/user_id:
    get:
      consumes:
      - application/json
      description: Получение ID пользователя по его имени
      parameters:
      - description: Имя пользователя
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_user_transport_http.GetUserIDResponse'
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Получение ID пользователя
      tags:
      - v2 / Пользователи
  /api/v2/ws:
    get:
      description: Обновление HTTP до WebSocket для обмена сообщениями в реальном
        времени (v2)
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: object
      summary: WebSocket-соединение
      tags:
      - v2 / WebSocket
swagger: "2.0"
