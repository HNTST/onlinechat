name: Deploy Backend

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Pull and Restart Backend
              run: |
                  export RUNNER_ALLOW_RUNASROOT="1"
                  cd ~/discordProject/
                  make update

                  docker compose down
                  docker compose up --build -d
