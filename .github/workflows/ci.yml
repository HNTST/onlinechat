name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Установка golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Поднятие тестовой инфраструктуры
        run: docker compose -f docker-compose.test.yml up --build --wait -d

      - name: go test
        run: APP_ENV=test go test -p 1 -count=1 ./...

      - name: Остановка тестовой инфраструктуры
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Deploy на Dokploy
        if: success()
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_API_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Секреты Dokploy не заданы — шаг деплоя пропущен"
            exit 0
          fi
          curl -fsSL -X POST "$DOKPLOY_API_URL/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}"
