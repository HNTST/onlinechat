version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "ST1005"
      - linters:
          - staticcheck
        text: "SA1029"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
