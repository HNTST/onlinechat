services:
  postgres-test:
    image: postgres:15-alpine
    container_name: discord-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: discord_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d discord_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:latest
    container_name: discord-test-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: test_admin
      MINIO_ROOT_PASSWORD: test_password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
