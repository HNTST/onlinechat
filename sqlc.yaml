version: "2"
sql:
  - engine: "postgresql"
    queries: "query/**/*.sql"
    schema: "migrations/*.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: false
        emit_empty_slices: true
        emit_exact_table_names: false
        emit_interface: false
        emit_result_struct_pointers: false
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
